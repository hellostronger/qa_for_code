# ============================================================
# Docker Compose — 一键部署 Code QA Service
# ============================================================
#
# 快速开始:
#   1. 准备 .env 文件（复制 .env.example 并填写）
#   2. 把源码放到 ./src-repo/ 或修改下方挂载路径
#   3. docker compose up -d
#   4. curl http://localhost:3100/api/health
#
# 认证方式: 见下方 ANTHROPIC_API_KEY / CLAUDE_OAUTH 注释
# ============================================================

version: '3.8'

services:
  qa-for-code:
    build:
      context: .
      dockerfile: Dockerfile
    image: qa-for-code:latest
    container_name: qa-for-code
    restart: unless-stopped
    ports:
      - "${PORT:-3100}:3100"

    # ============================================================
    # 环境变量
    # ============================================================
    environment:
      # --- 必填: 认证（二选一） ---
      # 方式 1: API Key（推荐，最简单）
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # 方式 2: OAuth Token（需先在宿主机 claude login）
      # 使用方式 2 时，取消下方 claude-auth volume 的注释，
      # 并注释掉 ANTHROPIC_API_KEY

      # --- 必填: 源码路径 ---
      - SOURCE_REPO_PATH=/src-repo

      # --- 生成文件工作区 ---
      - WORKSPACE_DIR=/workspace

      # --- 文件链接公开前缀（可选）---
      # 设置后生成的 /api/files 链接固定用此前缀，不随调用方 Host 变化
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}

      # --- 可选 ---
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
      - SESSION_TTL_MS=${SESSION_TTL_MS:-1800000}
      - RUN_TIMEOUT_MS=${RUN_TIMEOUT_MS:-300000}
      - MAX_CONCURRENT=${MAX_CONCURRENT:-3}

      # --- 第三方 API 代理（可选） ---
      # 例如使用 DeepSeek:
      # - ANTHROPIC_BASE_URL=https://api.deepseek.com/anthropic
      # - ANTHROPIC_AUTH_TOKEN=sk-your-deepseek-key
      # - ANTHROPIC_DEFAULT_SONNET_MODEL=deepseek-chat

    # ============================================================
    # 挂载
    # ============================================================
    volumes:
      # ★ 源码目录 — 修改左侧路径为你的实际项目路径
      #   ro = 只读，防止 Claude Code 修改源码
      - ./src-repo:/src-repo:ro

      # ★ 个人级 Skill 目录（可选）— 自定义 skill 映射到容器内
      #   ro = 只读，Claude Code 读取 skill，不会修改
      #   skill 放宿主机 ./skills/ 下（结构: skills/<skill-name>/SKILL.md）
      - ./skills:/home/node/.claude/skills:ro

      # ★ 生成文件工作区（可写）— Claude 生成的文件落盘于此，通过 /api/files 下载
      #   named volume 保留镜像内 node:node 的所有权
      - workspace:/workspace

      # Claude Code OAuth 认证持久化（可选）
      # 取消注释下面两行以使用 OAuth 方式:
      # - claude-auth:/home/node/.claude

    # ============================================================
    # 安全限制
    # ============================================================
    # 只读根文件系统
    read_only: true

    # /tmp 需要可写（Claude Code 运行时临时文件）
    tmpfs:
      - /tmp:exec,size=256M
      # home 目录可写（Claude Code 缓存、凭据）
      - /home/node/.claude:uid=1000,gid=1000,size=128M

    # 安全选项
    security_opt:
      - no-new-privileges:true

    # 禁止容器获取额外权限
    cap_drop:
      - ALL

    # 资源限制
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '0.5'

# ============================================================
# 持久化卷
# ============================================================
volumes:
  # 生成文件工作区
  workspace:
  # OAuth 认证持久化（可选，使用 OAuth 方式时取消注释）
  # claude-auth:
